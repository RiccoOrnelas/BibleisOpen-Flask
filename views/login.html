{%extends "index.html"%}

{%block styles%}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/register.css') }}">
{%endblock%}


{%block content%}

<div class="container">

    <div class="title">
        <h1> Faça seu Loging e compatilher seus próprios devocionais! </h1>
    </div>

    <form method="get" action="/autentication">

        <div class="form-item">
            <label for="email">Email:</label>
            <input name="email" placeholder="Seu Email" id="email" required>
        </div>
        <div class="form-item">
            <label for="password">Senha:</label>
            <input name="password" placeholder="Crie uma senha" id="password" required>
        </div>
        <br>
        <button type="submit">Entrar</button>
    </form>
</div>
{%endblock%}
